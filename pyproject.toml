[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emojicrypt"
version = "1.0.4"
description = "AES encryption encoded using emojis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.6"
authors = [
    {name = "Rutuparn Pawar", email = "rutuparn.pawar@outlook.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pycryptodome>=3.10.1",
]

[project.urls]
Homepage = "https://github.com/InputBlackBoxOutput/EmojiCrypt"
Repository = "https://github.com/InputBlackBoxOutput/EmojiCrypt"

[project.scripts]
emojicrypt = "emojicrypt.main:main"